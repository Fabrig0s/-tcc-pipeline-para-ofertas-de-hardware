name: Pipeline Analitico de Hardware

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  executar_pipeline_completo:
    runs-on: ubuntu-latest

    steps:
    - name: Fazer Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas scikit-learn beautifulsoup4 selenium google-cloud-bigquery db-dtypes openpyxl

    - name: Autenticar no Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

    - name: Fase 1 - Extração (Scraping Multi-lojas)
      run: |
        python extracao_lojas.py

    - name: Fase 2A - Carga no Banco de Dados (Load)
      run: |
        python carregar_dados.py

    - name: Fase 2B - Tratamento no BigQuery (Transform)
      run: |
        python tratar_dados.py

    - name: Fase 3 - Motor de Inteligência Artificial (ML)
      run: |
        python ml_model.py

    - name: Salvar Resultado Final para a Equipe (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: dados_enriquecidos_ia
        path: kabum_analisado.csv