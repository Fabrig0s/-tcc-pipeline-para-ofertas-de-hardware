name: Pipeline Analitico de Hardware

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  executar_pipeline_completo:
    runs-on: ubuntu-latest

    steps:
    - name: Fazer Checkout do Código
      uses: actions/checkout@v3

    - name: Configurar Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar Dependências (Requests, Pandas e Scikit-Learn)
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas scikit-learn

    - name: Fase 1 - Executar Motor de Extração (Scraping KaBuM!)
      run: |
        python extracao_kabum.py

    - name: Fase 2 - Executar Motor de Inteligência Artificial
      run: |
        python ml_model.py