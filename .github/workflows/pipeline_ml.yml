name: Pipeline Analitico de Hardware

# Define quando o robô vai rodar
on:
  schedule:
    # Roda todos os dias às 03:00 da manhã (horário UTC)
    - cron: '0 3 * * *'
  # Permite que você clique em um botão no GitHub para rodar manualmente na hora que quiser
  workflow_dispatch:

jobs:
  executar_ml:
    runs-on: ubuntu-latest

    steps:
    # 1. Copia o seu código do repositório para a máquina virtual
    - name: Fazer Checkout do Código
      uses: actions/checkout@v3

    # 2. Instala o Python
    - name: Configurar Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. Instala as bibliotecas que o seu modelo precisa
    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install pandas scikit-learn

    # 4. Roda o script que construímos acima
    - name: Executar Motor de Inteligência Artificial
      run: |
        python ml_model.py
        
    # (Opcional futuro) Passo para commitar o novo CSV analisado de volta pro repositório ou enviar pro BigQuery